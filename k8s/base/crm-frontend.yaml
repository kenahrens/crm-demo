apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-frontend
  labels:
    app: crm-demo
    component: crm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-demo
      component: crm-frontend
  template:
    metadata:
      labels:
        app: crm-demo
        component: crm-frontend
    spec:
      containers:
      - name: crm-frontend
        image: ghcr.io/kenahrens/crm-demo/crm-frontend:v1.3.2
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.1"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: crm-frontend
  labels:
    app: crm-demo
    component: crm-frontend
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: crm-demo
    component: crm-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-demo-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: crm-frontend
            port:
              number: 80

