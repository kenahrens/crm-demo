server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Resolver for dynamic upstream resolution (allows nginx to start even if upstream is unavailable)
    # Uses DNS_RESOLVER env var: 127.0.0.11 for Docker, kube-dns.kube-system.svc.cluster.local for K8s
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;
    resolver_timeout 5s;

    # Enable compression
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API proxy - use variable with resolver to allow nginx to start even if upstream is unavailable
    set $backend "http://crm-core:80";
    location /v1/api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Allow nginx to start even if backend is unavailable
        proxy_connect_timeout 1s;
        proxy_send_timeout 1s;
        proxy_read_timeout 1s;
    }

    # Serve static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }

    # Everything else goes to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Pragma "no-cache";
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
} 