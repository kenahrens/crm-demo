server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # DNS resolver - Docker embedded DNS server, fallback to system resolver
    # 127.0.0.11 is Docker's embedded DNS, 8.8.8.8 is fallback
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Enable compression
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API proxy - use variable to enable dynamic DNS resolution
    location /v1/api/ {
        set $backend "http://crm-core";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    # Fallback for when backend is unavailable
    location @backend_unavailable {
        return 503 '{"error": "Backend service temporarily unavailable"}';
        add_header Content-Type application/json;
    }

    # Serve static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }

    # Everything else goes to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Pragma "no-cache";
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
} 