name: CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/kenahrens/crm-demo/crm-core
  FRONTEND_IMAGE: ghcr.io/kenahrens/crm-demo/crm-frontend
  GO_VERSION: '1.24.1'
  NODE_VERSION: '18'

permissions:
  contents: read
  packages: write

jobs:
  # Step 1: Build Code
  build-backend:
    name: Build Backend Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: core-service
        run: go mod download

      - name: Build backend
        working-directory: core-service
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-service-binary
          path: core-service/core-service
          retention-days: 1

  build-frontend:
    name: Build Frontend Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1

  # Step 2: Lint Backend Code
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go linting
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          working-directory: core-service
          args: --timeout=5m

  # Step 3: Test
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run backend tests
        working-directory: core-service
        run: make test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --ci --coverage --watchAll=false

  # Step 4: Integration Tests (requires PROXYMOCK_API_KEY secret)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check for proxymock secret
        env:
          PROXYMOCK_API_KEY: ${{ secrets.PROXYMOCK_API_KEY }}
        run: |
          if [ -z "$PROXYMOCK_API_KEY" ]; then
            echo "::warning::PROXYMOCK_API_KEY secret not configured, skipping integration tests"
            exit 0
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup proxymock
        env:
          PROXYMOCK_API_KEY: ${{ secrets.PROXYMOCK_API_KEY }}
        run: |
          if [ -z "$PROXYMOCK_API_KEY" ]; then
            echo "Skipping proxymock setup - no API key"
            exit 0
          fi
          curl -Lfs https://downloads.speedscale.com/proxymock/install-proxymock | sh
          echo "$HOME/.speedscale" >> $GITHUB_PATH
          $HOME/.speedscale/proxymock init --api-key "$PROXYMOCK_API_KEY"

      - name: Build backend
        working-directory: core-service
        run: make build

      - name: Run integration tests
        env:
          PROXYMOCK_API_KEY: ${{ secrets.PROXYMOCK_API_KEY }}
        working-directory: core-service
        run: |
          if [ -z "$PROXYMOCK_API_KEY" ]; then
            echo "Skipping integration tests - no API key"
            exit 0
          fi
          make integration-test

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            core-service/logs/
            core-service/proxymock/
          retention-days: 5
          if-no-files-found: ignore

  # Step 5: Build Container
  build-backend-container:
    name: Build Backend Container
    runs-on: ubuntu-latest
    needs: [build-backend, test-backend, lint-backend]
    if: ${{ always() && needs.build-backend.result == 'success' && needs.test-backend.result == 'success' && needs.lint-backend.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend container
        uses: docker/build-push-action@v5
        with:
          context: core-service
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend-container:
    name: Build Frontend Container
    runs-on: ubuntu-latest
    needs: [build-frontend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend container
        uses: docker/build-push-action@v5
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Step 6: Test Container
  test-backend-container:
    name: Test Backend Container
    runs-on: ubuntu-latest
    needs: [build-backend-container]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: crm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend container for testing
        run: |
          echo "Building backend container locally for testing..."
          docker build -t ${{ env.BACKEND_IMAGE }}:test core-service
          echo "CONTAINER_TAG=${{ env.BACKEND_IMAGE }}:test" >> $GITHUB_ENV

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U core; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Test backend container
        run: |
          chmod +x .github/scripts/test-backend-container.sh
          .github/scripts/test-backend-container.sh ${{ env.CONTAINER_TAG }}

  test-frontend-container:
    name: Test Frontend Container
    runs-on: ubuntu-latest
    needs: [build-frontend-container]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build frontend container for testing
        run: |
          echo "Building frontend container locally for testing..."
          docker build -t ${{ env.FRONTEND_IMAGE }}:test frontend
          echo "CONTAINER_TAG=${{ env.FRONTEND_IMAGE }}:test" >> $GITHUB_ENV

      - name: Test frontend container
        run: |
          chmod +x .github/scripts/test-frontend-container.sh
          .github/scripts/test-frontend-container.sh ${{ env.CONTAINER_TAG }}

